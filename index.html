<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта Крипторынка: Киберпанк</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0d0221; /* Глубокий темно-фиолетовый */
            color: #f0f0f0;
            font-family: 'Roboto Mono', monospace;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Предотвращаем прокрутку, если SVG большой */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .header-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 2rem;
            color: #00f0ff; /* Яркий голубой неон */
            text-shadow: 0 0 5px #00f0ff, 0 0 10px #00f0ff, 0 0 15px #00f0ff, 0 0 20px #ff00ff, 0 0 30px #ff00ff;
            margin-bottom: 20px;
            text-align: center;
            padding: 10px;
        }
        #mindmap-container {
            width: 95vw;
            height: 85vh;
            background-color: #1a0a38; /* Темно-фиолетовый фон для контейнера */
            border: 2px solid #ff00ff; /* Пурпурная неоновая рамка */
            box-shadow: 0 0 15px #ff00ff, inset 0 0 10px #ff00ff;
            border-radius: 15px;
            position: relative;
        }
        svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        .node circle {
            stroke: #00f0ff; /* Голубая обводка */
            stroke-width: 2px;
            filter: drop-shadow(0 0 3px #00f0ff); /* Свечение для кругов */
        }
        .node text.node-label { /* Класс для текстовых меток */
            font-family: 'Roboto Mono', monospace;
            fill: #e0e0e0; /* Светлый текст */
            font-size: 10px;
            text-shadow: 0 0 3px #00f0ff; /* Легкое свечение текста */
            pointer-events: none;
        }
        .node text.node-icon { /* Класс для иконок */
            font-size: 16px; /* Размер иконки */
            fill: #00f0ff; /* Цвет иконки - неоновый голубой */
            text-shadow: 0 0 5px #00f0ff, 0 0 8px #ff00ff;
            pointer-events: none;
        }

        .node.root > circle { r: 50px !important; fill: #1f0a4d; }
        .node.root > text.node-icon { font-size: 28px; }
        .node.root > text.node-label { font-size: 12px; font-weight: bold; fill: #ff00ff; }


        .node.main-category > circle {
            r: 35px !important;
            fill: #2c125c;
        }
        .node.main-category > text.node-icon { font-size: 20px; }
        .node.main-category > text.node-label {
            font-size: 11px; /* Уменьшил немного для лучшего размещения с иконкой */
            font-weight: bold;
            fill: #ff00ff;
        }

        .node.sub-category > circle {
            r: 25px !important;
            fill: #4a237a;
        }
        .node.sub-category > text.node-icon { font-size: 16px; }
        .node.sub-category > text.node-label {
            font-size: 9px; /* Уменьшил */
            fill: #00f0ff;
        }

        .node.item > circle {
            r: 18px !important; /* Немного увеличил для иконки */
            fill: #6b3093;
        }
        .node.item > text.node-icon { font-size: 12px; }
        .node.item > text.node-label {
            font-size: 8px; /* Уменьшил, но будет отображаться */
            fill: #f0f0f0;
        }
        .link {
            stroke: #ff00ff; /* Пурпурные линии */
            stroke-opacity: 0.7;
            stroke-width: 1.5px;
            filter: drop-shadow(0 0 2px #ff00ff); /* Свечение для линий */
        }
        .tooltip {
            position: absolute;
            text-align: center;
            padding: 8px;
            font-size: 12px;
            background: rgba(0,0,0,0.85);
            border: 1px solid #00f0ff;
            border-radius: 8px;
            color: #00f0ff;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            box-shadow: 0 0 10px #00f0ff;
            max-width: 200px;
            word-wrap: break-word;
        }
        .controls {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        .controls button {
            background-color: #2c125c;
            color: #00f0ff;
            border: 1px solid #00f0ff;
            padding: 8px 12px;
            border-radius: 5px;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            cursor: pointer;
            transition: background-color 0.3s, box-shadow 0.3s;
        }
        .controls button:hover {
            background-color: #4a237a;
            box-shadow: 0 0 10px #00f0ff;
        }
        @keyframes backgroundGrid {
            0% { background-position: 0 0; }
            100% { background-position: 50px 50px; }
        }
        #mindmap-container::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                linear-gradient(to right, rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 25px 25px;
            animation: backgroundGrid 4s linear infinite;
            z-index: 0;
            border-radius: 15px;
        }
        svg {
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>
    <h1 class="header-title">Ландшафт Крипторынка 2025</h1>
    <div id="mindmap-container">
        <div class="controls">
            <button id="zoom-in">+</button>
            <button id="zoom-out">-</button>
            <button id="reset-zoom">Центр</button>
        </div>
        <div class="tooltip"></div>
    </div>

    <script>
        // Структура данных для mindmap с иконками
        // Иконки: 🌐 - мир/сеть, 📊 - сегменты, 🏦 - CEX, 🔗 - DeFi, 🖼️ - NFT, 👛 - кошельки, 🚀 - L2, 💲 - стейблкоины
        // 🪙 - криптовалюты, ₿ - Bitcoin, ♦️ - Ethereum, 💸 - платежные, 📜 - смарт-контракты, 🕵️ - Monero
        // 📈 - тренды, ⚖️ - регулирование, 🌉 - TradFi, ⏩ - Рост L2, 🧠🔗 - AI+Блокчейн, 🔄 - DeFi 2.0, 🎮 - GameFi, ✨ - UX
        // ⚙️⬆️ - драйверы роста, 🏢 - институц., 🧱 - блокчейн, 🏠🔗 - RWA, 🛒 - платежи, ✅ - ясность
        const mindmapData = {
            name: "Крипторынок 2025", type: "root", icon: "🌌", description: "Общий ландшафт криптовалютной индустрии в 2025 году.",
            children: [
                {
                    name: "Сегменты Рынка", type: "main-category", icon: "📊", description: "Основные сегменты криптовалютного рынка.",
                    children: [
                        { name: "CEX", type: "sub-category", icon: "🏦", description: "Централизованные биржи.",
                            children: [
                                { name: "Binance", type: "item", icon: "B", description: "Крупнейшая биржа." },
                                { name: "Coinbase", type: "item", icon: "C", description: "Популярна в США." },
                                { name: "Kraken", type: "item", icon: "K", description: "Старейшая биржа." }
                            ]
                        },
                        { name: "DeFi & DEX", type: "sub-category", icon: "🔗", description: "Децентрализованные финансы и биржи.",
                            children: [
                                { name: "Uniswap", type: "item", icon: "🦄", description: "Ведущая DEX." },
                                { name: "Aave", type: "item", icon: "👻", description: "Лидер кредитования." },
                                { name: "MakerDAO", type: "item", icon: "⚖️", description: "Протокол DAI." }
                            ]
                        },
                        { name: "NFT Маркетплейсы", type: "sub-category", icon: "🖼️", description: "Платформы для торговли NFT.",
                            children: [
                                { name: "OpenSea", type: "item", icon: "🌊", description: "Крупнейший NFT маркетплейс." },
                                { name: "Magic Eden", type: "item", icon: "🧙", description: "Доминирует на Solana." }
                            ]
                        },
                        { name: "Кошельки", type: "sub-category", icon: "👛", description: "Инструменты для управления активами.",
                            children: [
                                { name: "MetaMask", type: "item", icon: "🦊", description: "Популярный программный кошелек." },
                                { name: "Trust Wallet", type: "item", icon: "🛡️", description: "Мобильный кошелек Binance." },
                                { name: "Ledger/Trezor", type: "item", icon: "🔒", description: "Аппаратные кошельки." }
                            ]
                        },
                        { name: "L2 Решения", type: "sub-category", icon: "🚀", description: "Решения масштабирования L2.",
                            children: [
                                { name: "Polygon", type: "item", icon: "🟣", description: "Ведущая L2 экосистема." },
                                { name: "Arbitrum", type: "item", icon: "🅰️", description: "Лидер Optimistic Rollup." },
                                { name: "Optimism", type: "item", icon: "🔴", description: "Популярный Optimistic Rollup." }
                            ]
                        },
                        { name: "Стейблкоины", type: "sub-category", icon: "💲", description: "Эмитенты стейблкоинов.",
                            children: [
                                { name: "Tether (USDT)", type: "item", icon: "₮", description: "Крупнейший стейблкоин." },
                                { name: "Circle (USDC)", type: "item", icon: "C", description: "Второй по величине." },
                                { name: "MakerDAO (DAI)", type: "item", icon: "D", description: "Децентрализованный стейблкоин." }
                            ]
                        }
                    ]
                },
                {
                    name: "Криптовалюты", type: "main-category", icon: "🪙", description: "Обзор основных криптовалют.",
                    children: [
                        { name: "Bitcoin (BTC)", type: "sub-category", icon: "₿", description: "'Цифровое золото'." },
                        { name: "Ethereum (ETH)", type: "sub-category", icon: "♦️", description: "'Мировой компьютер'." },
                        { name: "Платежные", type: "sub-category", icon: "💸", description: "Криптовалюты для платежей.",
                            children: [
                                { name: "Ripple (XRP)", type: "item", icon: "✖️", description: "Трансграничные платежи." },
                                { name: "Stellar (XLM)", type: "item", icon: "✨", description: "Быстрые переводы." },
                                { name: "Bitcoin Cash (BCH)", type: "item", icon: "💵", description: "Peer-to-peer деньги." },
                                { name: "Litecoin (LTC)", type: "item", icon: "Ł", description: "'Цифровое серебро'." }
                            ]
                        },
                        { name: "Смарт-Контракты", type: "sub-category", icon: "📜", description: "Платформы смарт-контрактов.",
                            children: [
                                { name: "Solana (SOL)", type: "item", icon: "☀️", description: "Высокопроизводительный L1." },
                                { name: "Cardano (ADA)", type: "item", icon: "🐉", description: "L1 на исследованиях." },
                                { name: "BNB", type: "item", icon: "🔶", description: "Токен Binance." },
                                { name: "Polkadot (DOT)", type: "item", icon: "⚫", description: "L0 для интероперабельности." }
                            ]
                        },
                        { name: "Monero (XMR)", type: "sub-category", icon: "🕵️", description: "Приватная монета." }
                    ]
                },
                {
                    name: "Тренды 2025", type: "main-category", icon: "📈", description: "Ключевые тенденции индустрии.",
                    children: [
                        { name: "Регулирование", type: "item", icon: "⚖️", description: "Усиление внимания." },
                        { name: "Интеграция TradFi", type: "item", icon: "🌉", description: "С традиционными финансами." },
                        { name: "Рост L2", type: "item", icon: "⏩", description: "Бум решений L2." },
                        { name: "AI и Блокчейн", type: "item", icon: "🧠", description: "Синергия технологий." },
                        { name: "DeFi 2.0", type: "item", icon: "🔄", description: "Новые протоколы." },
                        { name: "NFT & GameFi", type: "item", icon: "🎮", description: "Зрелость рынков." },
                        { name: "Улучшение UX", type: "item", icon: "✨", description: "Упрощение интерфейсов." }
                    ]
                },
                 {
                    name: "Драйверы Роста", type: "main-category", icon: "⚙️", description: "Факторы роста рынка.", // Измененная иконка
                    children: [
                        { name: "Институц. Принятие", type: "item", icon: "🏢", description: "Вход крупных компаний." },
                        { name: "Развитие Блокчейн", type: "item", icon: "🧱", description: "Инновации технологии." },
                        { name: "Рост DeFi", type: "item", icon: "🔗", description: "Альтернативы банкам." }, // Повтор иконки, но контекст другой
                        { name: "Токенизация RWA", type: "item", icon: "🏠", description: "Цифровые реальные активы." },
                        { name: "Принятие Платежей", type: "item", icon: "🛒", description: "Использование в оплате." },
                        { name: "Регул. Ясность", type: "item", icon: "✅", description: "Четкие правила." }
                    ]
                }
            ]
        };

        const container = document.getElementById('mindmap-container');
        const width = container.clientWidth;
        const height = container.clientHeight;

        const svg = d3.select("#mindmap-container").append("svg")
            .attr("viewBox", [-width / 2, -height / 2, width, height])
            .style("font", "10px sans-serif");

        const g = svg.append("g");

        const root = d3.hierarchy(mindmapData);
        const links = root.links();
        const nodes = root.descendants();

        const simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(links).id(d => d.id).distance(d => {
                if (d.source.depth === 0) return 180; 
                if (d.source.depth === 1) return 120; 
                return 70; 
            }).strength(0.7)) 
            .force("charge", d3.forceManyBody().strength(d => {
                if (d.depth === 0) return -1500;
                if (d.depth === 1) return -800;
                return -400; 
            }))
            .force("center", d3.forceCenter(0, 0))
            .force("x", d3.forceX().strength(0.05))
            .force("y", d3.forceY().strength(0.05))
            .force("collision", d3.forceCollide().radius(d => { 
                 if (d.depth === 0) return 55;
                 if (d.data.type === "main-category") return 40;
                 if (d.data.type === "sub-category") return 30;
                 return 22;
            }));


        const link = g.append("g")
            .attr("class", "links")
            .selectAll("line")
            .data(links)
            .join("line")
            .attr("class", "link");

        const node = g.append("g")
            .attr("class", "nodes")
            .selectAll("g")
            .data(nodes)
            .join("g")
            .attr("class", d => `node ${d.data.type || 'item'}`)
            .call(drag(simulation));

        node.append("circle")
            .attr("r", d => {
                if (d.depth === 0) return 50;
                if (d.data.type === "main-category") return 35;
                if (d.data.type === "sub-category") return 25;
                return 18; 
            });

        // Add icon
        node.append("text")
            .attr("class", "node-icon")
            .attr("text-anchor", "middle")
            .attr("dy", d => {
                const isLeaf = d.data.type === "item" || (d.data.type === "sub-category" && !d.children);
                const hasLongName = d.data.name.split(/\s+/).length > 1;
                const hasChildrenOrIsDeep = d.children || d.depth > 1;

                if (isLeaf) return "0.1em"; // Icon centered for leaves
                if (hasLongName && hasChildrenOrIsDeep) return "-0.3em"; // Icon higher for non-leaves with multi-line text
                return "-0.4em"; // Default for non-leaves (icon higher)
            })
            .text(d => d.data.icon || "");

        // Add text label
        node.append("text")
            .attr("class", "node-label")
            .attr("text-anchor", "middle")
            .each(function(d) {
                const textElement = d3.select(this);
                const words = d.data.name.split(/\s+/).reverse(); 
                let word;
                let line = [];
                const lineHeight = 1.1; // ems
                let yPosition; // This will be the dy for the first tspan

                if (d.data.icon) { 
                    const isLeaf = d.data.type === "item" || (d.data.type === "sub-category" && !d.children);
                    if (isLeaf) {
                        // Leaf node with icon: icon is at dy="0.1em". Text should be below.
                        yPosition = 0.9; // Adjusted to be clearly below the centered icon
                    } else if (d.depth === 0) { // Root node with icon
                        yPosition = 1.1; // Text further down from raised icon (was 0.9, icon higher)
                    } else { // Non-leaf, non-root node with icon
                        yPosition = 1.0; // Text below raised icon (was 0.8, icon higher)
                    }
                } else { // No icon, text is centered
                    yPosition = 0.31;
                }

                let tspan = textElement.text(null).append("tspan")
                                .attr("x", 0)
                                .attr("dy", yPosition + "em");
                
                const maxWidth = (d.depth === 0 ? 80 :
                                 d.data.type === "main-category" ? 55 :
                                 (d.data.type === "sub-category" && d.children) ? 40 : // sub-category with children
                                 30); // item or sub-category leaf (increased slightly)

                let lineCount = 0;

                while (word = words.pop()) {
                    line.push(word);
                    tspan.text(line.join(" "));
                    if (tspan.node().getComputedTextLength() > maxWidth && line.length > 1) {
                        line.pop();
                        tspan.text(line.join(" "));
                        line = [word];
                        tspan = textElement.append("tspan")
                                    .attr("x", 0)
                                    .attr("dy", lineHeight + "em") 
                                    .text(word);
                        lineCount++;
                    }
                }

                // Vertical centering for multi-line text block
                if (lineCount > 0) {
                    const firstTspan = textElement.select("tspan");
                    // Get the original dy of the first tspan (which includes yPosition)
                    const currentFirstTspanDy = parseFloat(firstTspan.attr("dy").replace("em",""));
                    // Shift the first tspan up by half the height of the *additional* lines
                    // to center the entire block.
                    firstTspan.attr("dy", (currentFirstTspanDy - (lineCount * lineHeight / 2)) + "em");
                }
            });


        const tooltip = d3.select(".tooltip");
        node.on("mouseover", function(event, d) {
            tooltip.transition().duration(200).style("opacity", .9);
            tooltip.html(`<strong>${d.data.icon ? d.data.icon + ' ' : ''}${d.data.name}</strong><br>${d.data.description || ''}`)
                .style("left", (event.pageX + 15) + "px")
                .style("top", (event.pageY - 28) + "px");
            d3.select(this).select("circle").style("stroke", "#ff00ff").style("stroke-width", "3px");
            link.style('stroke-opacity', o => (o.source === d || o.target === d ? 1 : 0.3));
            link.style('stroke', o => (o.source === d || o.target === d ? '#00f0ff' : '#ff00ff'));
        })
        .on("mouseout", function(event, d) {
            tooltip.transition().duration(500).style("opacity", 0);
            d3.select(this).select("circle").style("stroke", "#00f0ff").style("stroke-width", "2px");
            link.style('stroke-opacity', 0.7);
            link.style('stroke', '#ff00ff');
        });

        simulation.on("tick", () => {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);
            node
                .attr("transform", d => `translate(${d.x},${d.y})`);
        });

        function drag(simulation) {
            function dragstarted(event, d) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
            }
            function dragged(event, d) {
                d.fx = event.x;
                d.fy = event.y;
            }
            function dragended(event, d) {
                if (!event.active) simulation.alphaTarget(0);
                d.fx = null;
                d.fy = null;
            }
            return d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended);
        }

        const zoom = d3.zoom()
            .scaleExtent([0.2, 3]) 
            .on("zoom", (event) => {
                g.attr("transform", event.transform);
            });
        svg.call(zoom);
        d3.select("#zoom-in").on("click", function() { zoom.scaleBy(svg.transition().duration(300), 1.2); });
        d3.select("#zoom-out").on("click", function() { zoom.scaleBy(svg.transition().duration(300), 0.8); });
        d3.select("#reset-zoom").on("click", function() { svg.transition().duration(300).call(zoom.transform, d3.zoomIdentity.translate(0,0).scale(0.6)); }); 
        svg.call(zoom.transform, d3.zoomIdentity.translate(0,0).scale(0.6)); 

        setTimeout(() => {
            simulation.alphaTarget(0.01).restart(); 
             setTimeout(() => {
                simulation.stop();
            }, 3000);
        }, 7000); 
    </script>
</body>
</html>
